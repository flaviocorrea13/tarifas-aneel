          - type: markdown
            title: Como os valores são calculados
            content: |
              - **Tarifa final** = (TUSD + TE + bandeira) com ICMS, PIS e COFINS aplicados "por dentro".
              - **Economia estimada** = kWh gerados × tarifa final. É uma referência de energia evitada, não a fatura.
              - **Conta mínima** = 30 kWh de disponibilidade × tarifa + CIP/COSIP. Ajuste o valor `disp = 30` no template para 50 (bifásico) ou 100 (trifásico).
              - **Custo estimado no ciclo** só aparece se você configurou um sensor de consumo nas opções da integração.
