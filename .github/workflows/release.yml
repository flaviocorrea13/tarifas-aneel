name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir versão e extrair notas do CHANGELOG
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          manifest = json.loads(
              pathlib.Path(
                  "custom_components/tarifas_aneel/manifest.json"
              ).read_text(encoding="utf-8")
          )
          version = manifest["version"]
          if tag != f"v{version}":
              sys.exit(
                  f"Tag {tag} não corresponde à versão {version} do manifest"
              )

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if match is None or not match.group(1).strip():
              sys.exit(f"Seção {version} ausente ou vazia no CHANGELOG.md")

          pathlib.Path("release-notes.md").write_text(
              match.group(1).strip() + "\n", encoding="utf-8"
          )
          print(f"Notas da versão {version} prontas")
          PY

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "homeassistant==2024.10.0" \
            "pytest-homeassistant-custom-component==0.13.171" \
            "josepy==1.15.0" \
            python-dateutil

      - name: Pytest
        run: python -m pytest tests -q

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest \
            --verify-tag
